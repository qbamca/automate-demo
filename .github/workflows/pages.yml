name: Deploy GitHub Pages

# Pages serwuje z gałęzi gh-pages (źródło ustawione automatycznie przy jej
# utworzeniu). Ten workflow synchronizuje zawartość main -> gh-pages przy
# każdym pushu, więc wystarczy commitować do main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish main to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf .github
          touch .nojekyll
          git add -A
          git commit -m "deploy: ${GITHUB_SHA}"
          git push --force origin HEAD:gh-pages
